# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Define OrBS - reusable packages of CircleCI configuration
orbs:
  python: circleci/python@2.1
  node: circleci/node@5.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"

  python-lint:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
          packages: flake8
      - run:
          name: "Run Flake8"
          command: "flake8 ."
  
  system-info:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "System Information"
          command: |
            echo "OS Information:"
            uname -a
            echo "CPU Information:"
            cat /proc/cpuinfo | grep "model name" | head -1
            echo "Memory Information:"
            free -h
            echo "Disk Information:"
            df -h
  
  random-greeting:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Generate Random Greeting"
          command: |
            GREETINGS=("Hello" "Hi" "Hey" "Greetings" "Welcome" "Howdy")
            EMOJIS=("👋" "😀" "🎉" "✨" "🚀" "💯")
            GREETING_INDEX=$((RANDOM % ${#GREETINGS[@]}))
            EMOJI_INDEX=$((RANDOM % ${#EMOJIS[@]}))
            echo "${GREETINGS[$GREETING_INDEX]} ${EMOJIS[$EMOJI_INDEX]}"
  
  scheduled-report:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Generate Weekly Report"
          command: |
            echo "# Weekly Report"
            echo "Generated on: $(date)"
            echo "## Summary"
            echo "This is a sample scheduled report that would run on a schedule."
            echo "## Statistics"
            echo "- Files in repository: $(find . -type f | wc -l)"
            echo "- Directories in repository: $(find . -type d | wc -l)"
  
  conditional-job:
    parameters:
      run-tests:
        type: boolean
        default: true
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - when:
          condition: << parameters.run-tests >>
          steps:
            - run:
                name: "Running Tests"
                command: "echo 'Running the tests...'"
      - unless:
          condition: << parameters.run-tests >>
          steps:
            - run:
                name: "Skipping Tests"
                command: "echo 'Tests have been skipped.'"

  deploy-docs:
    docker:
      - image: cimg/node:16.13
    steps:
      - checkout
      - run:
          name: "Install Dependencies"
          command: "echo 'Installing npm packages...'"
      - run:
          name: "Build Docs"
          command: "echo 'Building documentation...'"
      - run:
          name: "Deploy to GitHub Pages"
          command: "echo 'Simulating deployment to GitHub Pages...'"

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/workflows/ & https://circleci.com/docs/configuration-reference/#workflows
workflows:
  main-workflow:
    jobs:
      - say-hello
      - python-lint
      - system-info
      - random-greeting
      - conditional-job:
          name: run-with-tests
          run-tests: true
      - conditional-job:
          name: run-without-tests
          run-tests: false
          requires:
            - run-with-tests
  
  deploy-workflow:
    jobs:
      - say-hello
      - deploy-docs:
          requires:
            - say-hello
  
  scheduled-workflow:
    triggers:
      - schedule:
          cron: "0 0 * * 0"  # Run at midnight on Sundays
          filters:
            branches:
              only:
                - main
    jobs:
      - scheduled-report