# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Define OrBS - reusable packages of CircleCI configuration
orbs:
  python: circleci/python@2.1
  node: circleci/node@5.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
jobs:
  check-deploy-condition:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Check if commit message contains deploy"
          command: |
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "Commit message: $COMMIT_MSG"
            if echo "$COMMIT_MSG" | grep -i "deploy" > /dev/null; then
              echo "Commit message contains 'deploy', will trigger deploy steps"
              exit 0
            else
              echo "Commit message does not contain 'deploy', skipping deploy"
              exit 1
            fi
              
  check-intense-condition:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Check if commit message contains intense"
          command: |
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "Commit message: $COMMIT_MSG"
            if echo "$COMMIT_MSG" | grep -i "intense" > /dev/null; then
              echo "Commit message contains 'intense', will trigger intensive workflow"
              exit 0
            else
              echo "Commit message does not contain 'intense', skipping intensive workflow"
              exit 1
            fi

  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"
  
  system-info:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "System Information"
          command: |
            echo "OS Information:"
            uname -a
            echo "CPU Information:"
            cat /proc/cpuinfo | grep "model name" | head -1
            echo "Memory Information:"
            free -h
            echo "Disk Information:"
            df -h
  
  random-greeting:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Generate Random Greeting"
          command: |
            GREETINGS=("Hello" "Hi" "Hey" "Greetings" "Welcome" "Howdy")
            EMOJIS=("👋" "😀" "🎉" "✨" "🚀" "💯")
            GREETING_INDEX=$((RANDOM % ${#GREETINGS[@]}))
            EMOJI_INDEX=$((RANDOM % ${#EMOJIS[@]}))
            echo "${GREETINGS[$GREETING_INDEX]} ${EMOJIS[$EMOJI_INDEX]}"
  
  scheduled-report:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Generate Scheduled Report"
          command: |
            echo "# Scheduled Report"
            echo "Generated on: $(date)"
            echo "## Summary"
            echo "This is a sample report that runs every 3 minutes."
            echo "## Statistics"
            echo "- Files in repository: $(find . -type f | wc -l)"
            echo "- Directories in repository: $(find . -type d | wc -l)"
            echo "- Current time: $(date +%H:%M:%S)"
  
  conditional-job:
    parameters:
      run-tests:
        type: boolean
        default: true
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - when:
          condition: << parameters.run-tests >>
          steps:
            - run:
                name: "Running Tests"
                command: "echo 'Running the tests...'"
      - unless:
          condition: << parameters.run-tests >>
          steps:
            - run:
                name: "Skipping Tests"
                command: "echo 'Tests have been skipped.'"

  deploy-docs:
    docker:
      - image: cimg/node:16.13
    steps:
      - checkout
      - run:
          name: "Install Dependencies"
          command: "echo 'Installing npm packages...'"
      - run:
          name: "Build Docs"
          command: "echo 'Building documentation...'"
      - run:
          name: "Deploy to GitHub Pages"
          command: "echo 'Simulating deployment to GitHub Pages...'"
          
  # Medium-length jobs that take 2-5 minutes
  code-analysis:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: "Install analysis tools"
          command: "echo 'Installing code analysis tools...'"
      - run:
          name: "Analyze code quality"
          command: |
            echo "Starting code quality analysis..."
            # Simulate a code quality analysis that takes about 2-3 minutes
            echo "Analyzing Python modules..."
            sleep 60
            echo "Analyzing JavaScript modules..."
            sleep 45
            echo "Generating code quality report..."
            sleep 30
            echo "Code analysis complete!"

  load-test:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: "Install load testing tools"
          command: "echo 'Installing load testing tools...'"
      - run:
          name: "Run load tests"
          command: |
            echo "Starting load tests..."
            echo "Simulating 100 virtual users..."
            for i in {1..3}; do
              echo "Running load test phase $i/3..."
              sleep 60
              echo "Phase $i complete, response time: $((200 + RANDOM % 300))ms"
            done
            echo "Load testing complete!"
            
  performance-benchmark:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Prepare benchmark environment"
          command: "echo 'Setting up benchmark environment...'"
      - run:
          name: "Run benchmarks"
          command: |
            echo "Running performance benchmarks..."
            for benchmark in "API Response" "Database Query" "File Processing" "Image Rendering"; do
              echo "Benchmarking: $benchmark"
              sleep 30
              echo "$benchmark: $((50 + RANDOM % 200))ms"
            done
            echo "Generating benchmark report..."
            sleep 45
            echo "Benchmark testing complete!"

  # Long-running jobs that take 5-30 minutes
  stress-test:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: "Install stress test dependencies"
          command: "echo 'Installing dependencies...'"
      - run:
          name: "Run CPU Stress Test"
          command: |
            echo "Starting CPU stress test..."
            # Simulate CPU-intensive task with Python
            python -c "import time; print('Starting stress test...'); [time.sleep(0.01) for _ in range(600*100)]; print('25% complete'); [time.sleep(0.01) for _ in range(600*100)]; print('50% complete'); [time.sleep(0.01) for _ in range(600*100)]; print('75% complete'); [time.sleep(0.01) for _ in range(600*100)]; print('Stress test complete!')"

  data-processing:
    docker:
      - image: cimg/python:3.9
    resource_class: medium+
    steps:
      - checkout
      - run:
          name: "Install data processing dependencies"
          command: "echo 'Installing data processing packages...'"
      - run:
          name: "Process large dataset"
          command: |
            echo "Simulating processing of large dataset..."
            # Generate a large file with random data
            python -c "import random; import time; f = open('large_data.txt', 'w'); [f.write(f'{random.random()},{random.random()},{random.random()}\n') for _ in range(10000)]; f.close(); print('Data generated.')"
            # Process it line by line with occasional sleep to simulate complex processing
            python -c "import time; count = 0; print('Starting processing...'); f = open('large_data.txt', 'r'); lines = f.readlines(); f.close(); for i, line in enumerate(lines): count += 1; if i % 1000 == 0: print(f'Processed {i} records'); time.sleep(5); print(f'Simulated processing complete. Processed {count} records.'); time.sleep(600);"

  integration-tests:
    docker:
      - image: cimg/python:3.9
      - image: cimg/postgres:14.0
        environment:
          POSTGRES_USER: circleci
          POSTGRES_PASSWORD: password
          POSTGRES_DB: circle_test
    steps:
      - checkout
      - run:
          name: "Wait for DB"
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: "Setup test database"
          command: |
            echo "Setting up test database..."
            sleep 60  # Give DB time to fully initialize
      - run:
          name: "Run integration tests"
          command: |
            echo "Running integration test suite..."
            # Simulate long-running integration tests
            for i in {1..15}; do
              echo "Running test group $i of 15..."
              sleep 60
              echo "Test group $i completed."
            done
            echo "All integration tests complete!"
            
  security-scan:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: "Install security scanning tools"
          command: "echo 'Installing security scanners...'"
      - run:
          name: "Run vulnerability scan"
          command: |
            echo "Running comprehensive security scan..."
            # Simulate security scanning with progress updates
            total=20
            for i in $(seq 1 $total); do
              echo "Scanning component $i of $total..."
              # Simulate varying scan times
              sleep_time=$((30 + RANDOM % 60))
              sleep $sleep_time
              echo "Component $i scan complete."
            done
            echo "Security scan complete! No vulnerabilities found."

# Define pipeline parameters for selective workflow execution
parameters:
  run-main-workflow:
    type: boolean
    default: true
  custom-message:
    type: string
    default: "Default message"

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/workflows/ & https://circleci.com/docs/configuration-reference/#workflows
workflows:


  main-workflow:
    when: << pipeline.parameters.run-main-workflow >>
    jobs:
      - say-hello
      - system-info
      - random-greeting:
          filters:
            branches:
              only:
                - main
                - circleci-project-setup
      - conditional-job:
          name: run-with-tests
          run-tests: true
      - conditional-job:
          name: run-without-tests
          run-tests: false
          requires:
            - run-with-tests
            
  # Long-running workflow
  intensive-workflow:
    jobs:
      - check-intense-condition
      - stress-test:
          requires:
            - check-intense-condition
      - data-processing:
          requires:
            - stress-test
      - integration-tests:
          requires:
            - stress-test
      - security-scan:
          requires:
            - check-intense-condition
            
  # Medium-length workflow (2-5 minutes per job)
  medium-workflow:
    jobs:
      - code-analysis
      - load-test
      - performance-benchmark
  
  deploy-workflow:
    jobs:
      - check-deploy-condition
      - deploy-docs:
          requires:
            - check-deploy-condition
          filters:
            branches:
              only:
                - circleci-project-setup
                - main
